  - Projects involving external research collaborators
  - Other Hopkins-affiliated groups

# Q13 (services) and Q42 (areas of strength) share this list.
services:
  - name: AI-Assisted Coding
    detail: Using ChatGPT, Copilot, or other AI tools for code generation and debugging
  - name: Containerization and Cloud Computing
    detail: Amazon Web Services (AWS); cloud architecture; cloud infrastructure management; cloud migration; containerization; Infrastructure as Code; Kubernetes/container orchestration; Microsoft Azure
  - name: Data Pipeline Automation
    detail: Automation/scripting; data engineering; data integration; ETL/data pipelines
  - name: Databases
    detail: Data migration; data visualization/dashboards; data warehousing; database administration; database design and development
  - name: DevOps & Infrastructure Operations
    detail: Automated deployments; CI/CD pipeline development; DevOps engineering; environment management; hosting/infrastructure support; monitoring/logging/observability; production operations/support; server/system administration
  - name: High-Performance/Parallel Computing
    detail: Bioinformatics / computational biology; high-performance computing (HPC); scientific computing; statistical computing
  - name: IT Security & Compliance
    detail: Identity and access management; IT security/compliance assistance; security architecture
  - name: Machine Learning Operations
    detail: Model deployment; experiment tracking
  - name: Machine Learning/AI Development
    detail: Artificial intelligence / machine learning; data science; generative AI / large language models; image processing / computer vision; natural language processing; retrieval-augmented generation (RAG)
  - name: Python or R Package Development
    detail: Research software engineering
  - name: Reproducible Research Workflows
    detail: Data archival/preservation; research data management
  - name: Technical Consulting & Solution Architecture
    detail: Research software engineering; software architecture/design; solution architecture; technical consulting; technology evaluation / prototyping
  - name: Technical Documentation & Training
    detail: Technical documentation; user training
  - name: UX, Accessibility & Software Quality
    detail: Accessibility; performance testing; software testing / quality assurance; user experience (UX)/interface design
  - name: Version Control and Collaboration
    detail: Git/source-control management
  - name: Web Development
    detail: API development; application maintenance and enhancements; custom software/application development; legacy application modernization; low-code/no-code development; mobile application development; systems integration; web application development


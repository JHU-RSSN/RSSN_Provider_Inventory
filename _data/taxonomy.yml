  - name: Carey Business School
    short: Carey
    aliases: [Carey School]
  - name: IT@JH
    short: IT@JH
    aliases: [JH IT, JHIT, IT@JH, Johns Hopkins IT, Johns Hopkins Information Technology]
  - name: JHTV
    short: JHTV
    aliases: []
  - name: Krieger School of Arts and Sciences
    short: KSAS
    aliases: [Krieger School, KSAS]
  - name: Libraries
    short: Libraries
    aliases: [Sheridan Libraries, JHU Libraries]
  - name: Peabody Institute
    short: Peabody
    aliases: []
  - name: School of Advanced International Studies
    short: SAIS
    aliases: [Johns Hopkins SAIS]
  - name: School of Education
    short: SOE
    aliases: [SOE]
  - name: School of Government and Policy
    short: SGP
    aliases: [SGP]
  - name: School of Medicine
    short: SOM
    aliases: [SOM, JHU SOM]
  - name: School of Nursing
    short: SON
    aliases: [SON]
  - name: University Administration
    short: University Administration

# Controlled vocabularies for provider listings.
# Values mirror the RSSN Research IT Provider Questionnaire (draft 2 and the live form).
# Provider files must use these values exactly (spelling and punctuation) so filters work.
# Anything a team wrote in under "Other" goes in that field's "_other" text instead
# (for example `languages_other`). See _data/fields.yml for which list each field uses.
#
# List entries are either plain strings, or objects with:
#   label   what provider files use and the site shows
#   answer  the questionnaire wording, when it differs (used by scripts/import_responses.py)

# Q5. Institution
institutions:
  - label: JHU
    answer: Johns Hopkins University (JHU)
  - label: JHHS
    answer: Johns Hopkins Health System (JHHS)
  - label: Joint JHU/JHHS
    answer: Joint JHU/JHHS organization

# Q6. Schools, divisions, and central units. "short" is the label shown on cards.
# "color" is the card accent, chosen from the Hopkins secondary palette.
# "aliases" help the import script recognize the school inside free-text answers.
# A provider whose school isn't listed here still works; its card uses Heritage Blue.
schools:
  - name: Whiting School of Engineering
    short: Whiting School
    color: "#0077D8"   # Medium Blue
    aliases: [Whiting School, WSE]
  - name: School of Medicine
    short: School of Medicine
    color: "#008767"   # Homewood Green
    aliases: [SOM, JHU SOM]
  - name: Bloomberg School of Public Health
    short: Bloomberg School
    color: "#A45C98"   # Purple
    aliases: [Bloomberg School, School of Public Health, BSPH, JHSPH]
  - name: Sheridan Libraries
    short: Sheridan Libraries
    color: "#CBA052"   # Sand
    aliases: [Sheridan, JHU Libraries]
  - name: Office of Research
    short: Office of Research
    color: "#68ACE5"   # Spirit Blue
    aliases: []
  - name: Johns Hopkins IT
    short: JH IT
    color: "#FF9E1B"   # Orange
    aliases: [JH IT, JHIT, IT@JH, Johns Hopkins Information Technology]

# Q10. Available to researchers outside your own unit?
# "internal: true" marks answers meaning the team doesn't take requests from outside
# its own unit. The directory hides or separates those teams (see internal_teams in _config.yml).
availability:
  - label: Hopkins-wide
    answer: Yes - Hopkins-wide
  - label: JHU only
    answer: Yes - JHU only
  - label: JHHS only
    answer: Yes - JHHS only
  - label: Certain schools/divisions
    answer: Yes - but only within certain schools/divisions
  - label: Other criteria
    answer: Yes - other criteria
  - label: Own department/unit only
    answer: No - our services are limited to our own department/unit
    internal: true
  - label: Not outside own unit (other)
    answer: No - other
    internal: true


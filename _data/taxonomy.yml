# Controlled vocabularies for provider listings.
# Values mirror the RSSN Service Provider Inventory questionnaire (Qualtrics, 2026 version).
# Provider files must use these values exactly (spelling and punctuation) so filters work.
# Anything a team wrote in under "Other (please specify)" goes in that field's "_other"
# text instead (for example `languages_other`). See _data/fields.yml for which list each field uses.
#
# List entries are either plain strings, or objects with:
#   label   what provider files use and the site shows
#   answer  the questionnaire wording, when it differs (used by scripts/import_responses.py)
#   phrase  wording used in the generated card summary (see _includes/summary.html)
#   internal, paused  flags used by the site (see _includes/availability.html, accepting.html)
#
# "previous" maps the wording used in earlier questionnaires (Draft 2 pilot, Draft 3 Forms) to
# the value it becomes now. scripts/port_listings.py uses it to bring existing listings across,
# and it is the only place those older values are kept. A value that is in neither the current
# list nor "previous" is moved to the field's "_other" text and reported.

# Q8. Institution
institutions:
  - label: JHU
    answer: "Johns Hopkins University (JHU)"
  - label: JHHS
    answer: "Johns Hopkins Health System (JHHS)"
  - label: Joint JHU/JHHS
    answer: "Joint JHU/JHHS organization"

# Q9. Schools, divisions, and central units. "short" is the label shown on cards: the
# abbreviation where the JHU Editorial Style Guide has one, otherwise the shortest form.
# "aliases" help the import script recognize the school inside free-text answers.
# All cards use Heritage Blue, so no school has its own color.
# A provider whose school isn't listed here still works; its card shows the answer as written.
schools:

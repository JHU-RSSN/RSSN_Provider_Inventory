  - name: University Student Services
    short: University Student Services
    aliases: []
  - name: Whiting School of Engineering
    short: WSE
    aliases: [Whiting School, WSE]

# Q12. Which best describes your team?
team_type:
  - label: Research support service
    answer: "Our primary mission is providing services or support to researchers"
    phrase: a research support service
  - label: Research group sharing expertise
    answer: "We are a research group or center that also shares expertise, tools, or products with other researchers"
    phrase: a research group that shares its expertise with other researchers
  - label: IT service with research support
    answer: "We provide IT or technical services, and research support is one part of our work"
    phrase: an IT service team that supports research

# Q13. Is your team available to provide services outside your own unit?
# "internal: true" marks answers meaning the team doesn't take requests from outside
# its own unit. The directory hides those teams until the "outside requests only" box is unchecked.
availability:
  - label: Hopkins-wide
    answer: "Yes – Johns Hopkins-wide"
    phrase: available Hopkins-wide
  - label: JHU only
    answer: "Yes – JHU only"
    phrase: available to JHU researchers
  - label: JHHS only
    answer: "Yes – JHHS only"
    phrase: available to JHHS researchers
  - label: Certain schools/divisions
    answer: "Yes – only within certain schools/divisions"
    phrase: available within certain schools or divisions
  - label: Own department/unit only
    answer: "No – our services are limited to our own department/unit"
    phrase: working only within its own unit
    internal: true
  - label: It's complicated
    answer: "It's complicated"
    phrase: with availability that depends on the request

# Q14. Which researchers or organizations can engage your team?
eligible:
  - Cross-institution JHU/JHHS projects
  - JHHS faculty
  - JHHS staff
  - JHU faculty
  - JHU staff
  - JHU students/trainees working on sponsored research
  - Johns Hopkins research centers/institutes
  - Other Johns Hopkins-affiliated groups
  - Projects involving external research collaborators

# Q16-19. Services, in the questionnaire's four groups. Each team marks every service
# Not offered, Offered, or Area of Strength. Listings store every service under
# `services` as "not offered", "offered", or "strength" (no more than five strengths).
service_groups:
  - Software Development and Engineering
  - Data, AI, and Analytics
  - Computing and Infrastructure
  - Consulting, Training, and Sustainability

services:
  - name: AI-Assisted Coding
    group: Software Development and Engineering
    detail: Using ChatGPT, Copilot, or other AI tools for code generation and debugging
  - name: Python or R Package Development
    group: Software Development and Engineering
    detail: Research software engineering; package design and publishing
  - name: UX, Accessibility & Software Quality
    group: Software Development and Engineering
    detail: Accessibility; performance testing; software testing/QA; user experience and interface design
  - name: Version Control & Collaboration
    group: Software Development and Engineering
    detail: Git/source-control management; code review; making code citable
  - name: Web & Application Development
    group: Software Development and Engineering
    detail: Front-end, back-end, APIs; mobile and low-code apps; legacy modernization; systems integration
  - name: Data Pipeline Automation
    group: Data, AI, and Analytics
    detail: Automation/scripting; data engineering; data integration; ETL/data pipelines
  - name: Databases
    group: Data, AI, and Analytics
    detail: Database design and administration; data migration; data warehousing; dashboards and visualization
  - name: Machine Learning Operations
    group: Data, AI, and Analytics
    detail: Model deployment; experiment tracking
  - name: Machine Learning/AI Development
    group: Data, AI, and Analytics
    detail: AI/ML; data science; generative AI/LLMs; computer vision; NLP; RAG
  - name: Reproducible Research Workflows
    group: Data, AI, and Analytics
    detail: Research data management; data archiving/preservation; workflow managers
  - name: Containerization & Cloud Computing
    group: Computing and Infrastructure
    detail: AWS, Azure; cloud architecture and migration; containers; Kubernetes; infrastructure as code
  - name: DevOps & Infrastructure Operations
    group: Computing and Infrastructure
    detail: CI/CD; automated deployments; environment management; hosting; monitoring/logging; production operations; system administration
  - name: High-performance computing (HPC) / Parallel computing
    group: Computing and Infrastructure
    detail: HPC; GPU programming; distributed, scientific, and statistical computing; bioinformatics
  - name: IT Security & Compliance
    group: Computing and Infrastructure
    detail: Identity and access management; security/compliance assistance; security architecture
  - name: Domain/Subject-Matter Expertise
    group: Consulting, Training, and Sustainability
    detail: For example clinical informatics, EHR or claims data, or a discipline-specific tool or system
  - name: Open Source Licensing & Sustainability
    group: Consulting, Training, and Sustainability
    detail: Licensing; governance; community building; long-term sustainability
  - name: Technical Consulting & Solution Architecture
    group: Consulting, Training, and Sustainability
    detail: Software and solution architecture; technical consulting; technology evaluation/prototyping
  - name: Technical Documentation & Training
    group: Consulting, Training, and Sustainability
    detail: Technical documentation; user training


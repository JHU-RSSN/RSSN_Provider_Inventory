# Every listing field, grouped the way the RSSN Service Provider Inventory questionnaire
# (Qualtrics, 2026 version) groups them. Question numbers (q) are the questionnaire's export
# tags, so q: 25 is column Q25 in a Qualtrics export. Grids (services) cover Q16-19.
# Drives the profile page (_layouts/provider.html), the search data on the home page,
# the filter panel (assets/js/directory.js), the listing file format (scripts/listing_format.py),
# the import script (scripts/import_responses.py), the porting script (scripts/port_listings.py),
# and the checker (scripts/check_listings.py).
#
#   key       front-matter key in each _providers/*.md file
#   label     heading shown on the profile page and in filters
#   q         questionnaire question number (the Qualtrics export tag)
#   type      one (choose one), many (choose all that apply), short (one line of free text),
#             text (free text, Markdown allowed), or grid (the Q16-19 service grids)
#   options   list in _data/taxonomy.yml holding the allowed values
#   other     true if the form offers "Other (please specify)"; the write-in goes in "<key>_other"
#   derived   true for "strengths", which the site works out from the "services" grid
#             (services marked "strength"); it isn't stored in listing files
#   show      where the profile shows it: facts (the section's list), or a named spot
#             in the layout (header, services, aside, text, summary, none)
#
# Q2-3 (who filled out the form), Q4-5 (primary contact), Q10 (team name), Q11 (website),
# Q23 (the optional paragraph, which is the body text below the front matter), and Q6-7
# (the approving team lead) are handled directly by the layout and scripts. Q2-3 and Q6-7 are
# never stored in listings, since the repository is public.

sections:
  - id: organization
    title: Provider information
    fields:
      - { key: institution, label: Institution, q: 8, type: one, options: institutions, show: header }
      - { key: school, label: School / division, q: 9, type: one, options: schools, show: header }

  - id: who
    title: Who you support
    fields:
      - { key: team_type, label: Team type, q: 12, type: one, options: team_type, other: true, show: header }
      - { key: availability, label: Available to, q: 13, type: one, options: availability, show: header }
      - { key: availability_details, label: Availability details, q: 20, type: text, show: aside }
      - { key: eligible, label: Who can engage this team, q: 14, type: many, options: eligible, other: true, show: aside }

  - id: services
    title: Services & expertise
    fields:
      - { key: services, label: Services, q: 16-19, type: grid, options: services, show: services }
      - { key: strengths, label: Areas of strength, q: 16-19, type: grid, derived: true, options: services, show: services }
      - { key: services_other, label: Other services or expertise, q: 21, type: text, show: services }
      - { key: examples, label: Example projects, q: 22, type: text, show: text }

  - id: technical
    title: Technical capabilities
    fields:
      - { key: hands_on, label: Does hands-on technical work, q: 24, type: one, options: hands_on, show: none }
      - { key: languages, label: Languages and development technologies, q: 25, type: many, options: languages, other: true, show: facts }
      - { key: databases, label: Databases, q: 26, type: many, options: databases, other: true, show: facts }
      - { key: devops, label: Infrastructure and DevOps, q: 27, type: many, options: devops, other: true, show: facts }
      - { key: hosting, label: Computing and hosting environments, q: 28, type: many, options: hosting, other: true, show: facts }

  - id: research
    title: Research experience
    fields:
      - { key: research_areas, label: Research areas, q: 29, type: many, options: research_areas, other: true, show: facts }
      - { key: stages, label: Project stages, q: 30, type: many, options: stages, other: true, show: facts }
      - { key: grant_estimates, label: Technical estimates for grant proposals, q: 31, type: one, options: grant_estimates, show: facts }
      - { key: pre_award, label: Consults before funding is awarded, q: 32, type: one, options: pre_award, show: facts }
      - { key: consult_scope, label: Initial or pre-award consultation, q: 33, type: one, options: consult_scope, other: true, show: facts }

  - id: data
    title: Research data, security & compliance
    fields:
      - { key: data_types, label: Data types supported, q: 34, type: many, options: data_types, other: true, show: facts }
      - { key: compliance, label: Requirements and reviews supported, q: 35, type: many, options: compliance, other: true, show: facts }
      - { key: security_approach, label: Security and compliance approach, q: 36, type: one, options: security_approach, show: facts }

  - id: engagement
    title: Engagement model
    fields:
      - { key: engagement_types, label: Engagement types, q: 37, type: many, options: engagement_types, other: true, show: facts }
      - { key: project_sizes, label: Project sizes, q: 38, type: many, options: project_sizes, show: facts }
      - { key: durations, label: Engagement duration, q: 39, type: many, options: durations, show: facts }
      - { key: takeover, label: Takes over software from other teams, q: 40, type: one, options: takeover, show: facts }
      - { key: collaborate, label: Works with the project's technical staff, q: 41, type: one, options: collaborate, show: facts }

  - id: cost
    title: Cost & funding
    fields:
      - { key: cost, label: Cost to researchers, q: 42, type: one, options: cost, other: true, show: facts }
      - { key: free_limit, label: Where no-cost help ends, q: 43, type: short, show: facts }
      - { key: charges, label: How charges are calculated, q: 44, type: many, options: charges, other: true, show: facts }
      - { key: minimum, label: Minimum commitment, q: 45, type: one, options: minimum, show: facts }
      - { key: funding, label: How the team is funded, q: 46, type: many, options: funding, other: true, show: facts }

  - id: support
    title: Availability & support
    fields:
      - { key: accepting, label: Accepting new work, q: 47, type: one, options: accepting, show: facts }
      - { key: lead_time, label: Lead time to start, q: 48, type: one, options: lead_time, show: facts }
      - { key: production_support, label: Production support after launch, q: 49, type: one, options: production_support, show: facts }
      - { key: support_coverage, label: Support coverage, q: 50, type: many, options: support_coverage, show: facts }

  - id: sustainability
    title: Open source, software ownership & sustainability
    fields:
      - { key: open_source, label: Open source support, q: 51, type: many, options: open_source, other: true, show: facts }
      - { key: handoff_docs, label: Hands off code and documentation, q: 52, type: one, options: handoff_docs, show: facts }
      - { key: maintenance, label: Long-term maintenance, q: 53, type: one, options: maintenance, show: facts }

  - id: additional
    title: Additional information
    fields:
      - { key: notes, label: Good to know, q: 54, type: text, show: text }

# Filter panel on the home page, in display order. "open" starts the group expanded;
# "limit" shows that many options before a "Show more" link.
filters:
  - heading: Services
    fields:
      - { key: services, open: true, limit: 6 }
      - { key: strengths, limit: 6 }
  - heading: Organization
    fields:
      - { key: institution, open: true }
      - { key: team_type }
      - { key: school }
      - { key: availability }
      - { key: eligible }
  - heading: Cost & timing
    fields:
      - { key: cost }
      - { key: accepting }
      - { key: lead_time }
      - { key: minimum }
      - { key: support_coverage }
  - heading: Technology
    fields:
      - { key: languages, limit: 6 }
      - { key: databases, limit: 6 }
      - { key: devops, limit: 6 }
      - { key: hosting, limit: 6 }
  - heading: Research fit
    fields:
      - { key: research_areas, limit: 6 }
      - { key: stages, limit: 6 }
      - { key: pre_award }
  - heading: Data & compliance
    fields:
      - { key: data_types, limit: 6 }
      - { key: compliance, limit: 6 }
  - heading: Working together
    fields:
      - { key: engagement_types, limit: 6 }
      - { key: project_sizes }
      - { key: durations }
      - { key: open_source }

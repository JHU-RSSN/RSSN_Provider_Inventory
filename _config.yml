title: RSSN Provider Inventory
network_name: Research Software Support Network
description: Find Johns Hopkins teams that help researchers with software, data, and computing.

# The GitHub repository this site is built from. Used for "Suggest an edit on GitHub" links.
# Update this (and baseurl) if the repo is renamed or moved to another account/org.
repository: JHU-RSSN/RSSN_Provider_Inventory
branch: main

# Header logo. When central comms provides the RSSN logo lockup, add the file (an SVG is
# best, in the white/reversed version, since the header is Heritage Blue) to assets/img/
# and set its path here, e.g. "/assets/img/rssn-logo.svg". Leave "" to show the text name.
logo: ""

# The main RSSN site, where researchers should start when they need help. The home page
# points people there above the search box. Placeholder until the RSSN site is live.
rssn_help_url: "#"

# Where "Request a change" emails go (the request-a-change page). Leave "" to have
# people address the email themselves.
change_requests_email: ""

# Site address. For a project site, baseurl must match the repository name exactly.
url: "https://jhu-rssn.github.io"
baseurl: "/RSSN_Provider_Inventory"

# Shows the "sample data" banner on every page. Set to false once real listings are in.
prototype: true

markdown: kramdown

collections:
  providers:
    output: true
    permalink: /providers/:name/

defaults:
  - scope:
      path: ""
      type: providers
    values:
      layout: provider

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - scripts
